version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook123
      POSTGRES_DB: webhookdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/01-init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/02-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: woodhq/webhook-listener-backend:latest
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: webhook
      DB_PASSWORD: webhook123
      DB_NAME: webhookdb
      DB_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: woodhq/webhook-listener-frontend:latest
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8080
      HOST: 0.0.0.0
    depends_on:
      - backend

volumes:
  postgres_data:
